name: Release

# 发版全流程（改版本 -> 构建签名 APK -> 打 tag -> 发 Release -> 回写 update.json）
# 触发方式：
#   1) Actions 页面手动 Run workflow（推荐：版本/说明可留空，自动 +1 并自动生成更新说明）
#   2) 本地 push tag v*（兼容旧习惯，要求 tag 与 pubspec.yaml 版本一致）
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 0.1.34 或 0.1.34+34；留空 = 自动在当前版本上 +1"
        required: false
        default: ""
        type: string
      notes:
        description: "更新说明（留空 = 自动用上次 tag 以来的 commit 生成）"
        required: false
        default: ""
        type: string
      prerelease:
        description: "标记为预发布（不写入 update.json）"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and release notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True)

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          input_version = (os.environ.get("INPUT_VERSION") or "").strip()
          input_notes = (os.environ.get("INPUT_NOTES") or "").strip()
          prerelease = (os.environ.get("INPUT_PRERELEASE") or "false").strip().lower()

          pub = open("pubspec.yaml", encoding="utf-8").read()
          m = re.search(r"^version:\s*([0-9][0-9A-Za-z.\-]*)(?:\+(\d+))?\s*$", pub, re.M)
          if not m:
              sys.exit("pubspec.yaml 中找不到可用的 version 字段")
          cur_version, cur_build = m.group(1), int(m.group(2) or 0)

          if event == "push":
              raw = ref_name[1:] if ref_name.startswith("v") else ref_name
              if "+" in raw:
                  tag_version, tag_build = raw.split("+", 1)
                  build = int(tag_build)
              else:
                  tag_version, build = raw, cur_build
              if tag_version != cur_version:
                  sys.exit("tag %s 与 pubspec.yaml 的版本 %s 不一致，请先把 pubspec.yaml 改成 %s"
                           % (ref_name, cur_version, tag_version))
              version, bump = tag_version, "false"
          else:
              if input_version:
                  v = input_version.lstrip("v")
                  if "+" in v:
                      v, b = v.split("+", 1)
                      build = int(b)
                  else:
                      build = cur_build + 1
                  if not re.fullmatch(r"\d+\.\d+\.\d+", v):
                      sys.exit("版本号格式不合法：%s（应形如 0.1.34 或 0.1.34+34）" % input_version)
                  version = v
              else:
                  parts = cur_version.split(".")
                  try:
                      parts[-1] = str(int(parts[-1]) + 1)
                  except ValueError:
                      sys.exit("无法自动递增版本号：%s，请手动填写 version" % cur_version)
                  version, build = ".".join(parts), cur_build + 1
              bump = "true"

          if bump == "true":
              if build <= cur_build:
                  sys.exit("versionCode 必须递增：当前 %d，本次 %d" % (cur_build, build))
              if sh("git", "rev-parse", "-q", "--verify", "refs/tags/v" + version).returncode == 0:
                  sys.exit("tag v%s 已存在，请换一个版本号" % version)

          if input_notes:
              notes = input_notes
          else:
              base = "HEAD^" if event == "push" else "HEAD"
              d = sh("git", "describe", "--tags", "--abbrev=0", base)
              prev = d.stdout.strip() if d.returncode == 0 else ""
              rng = prev + "..HEAD" if prev else "HEAD"
              log = sh("git", "log", "--no-merges", "--pretty=format:%s", rng).stdout
              lines = []
              for line in log.splitlines():
                  line = line.strip()
                  if not line or re.match(r"^(chore\(release\)|v\d+\.\d+\.\d+:)", line):
                      continue
                  lines.append("- " + line)
              notes = "\n".join(lines[:40]) or "- 维护与细节改进"

          notes_path = os.path.join(os.environ.get("RUNNER_TEMP", "."), "notes.md")
          with open(notes_path, "w", encoding="utf-8") as f:
              f.write(notes.strip() + "\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("VERSION=%s\nBUILD=%s\nTAG=v%s\n" % (version, build, version))
              f.write("BUMP=%s\nPRERELEASE=%s\nNOTES_FILE=%s\n" % (bump, prerelease, notes_path))

          print("version=%s build=%s bump=%s prerelease=%s" % (version, build, bump, prerelease))
          print(notes)
          PY

      - name: Bump pubspec version and push
        run: |
          if [ "$BUMP" != "true" ]; then
            echo "tag 触发：版本由提交决定，跳过版本号写入"
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          version, build = os.environ["VERSION"], os.environ["BUILD"]
          path = "pubspec.yaml"
          text = open(path, encoding="utf-8").read()
          text, n = re.subn(r"^version:.*$", "version: %s+%s" % (version, build), text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("写入 pubspec.yaml 版本失败")
          open(path, "w", encoding="utf-8").write(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): v$VERSION+$BUILD [skip ci]"
          git push origin HEAD:main

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/xplay-release.jks
            echo "已用 ANDROID_KEYSTORE_BASE64 覆盖仓库内签名文件"
          fi
          if [ ! -f android/app/xplay-release.jks ]; then
            echo "::error::缺少签名文件 android/app/xplay-release.jks，且未配置 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          for v in KEYSTORE_PASSWORD KEYSTORE_KEY_PASSWORD KEYSTORE_KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::缺少仓库 Secret: $v"
              exit 1
            fi
          done
          mkdir -p android
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=xplay-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_KEY_PASSWORD" "$KEYSTORE_KEY_ALIAS" > android/key.properties
          echo "签名配置就绪"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - name: Build arm64 APK
        run: |
          set +e
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name="$VERSION" \
            --build-number="$BUILD" 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the actual failure in the job annotations (visible without
            # needing to download the full job log).
            tail -n 200 "$RUNNER_TEMP/build.log" |
              grep -v '^[[:space:]]*$' |
              grep -Ev '\([0-9][^)]* available\)$' | tail -n 10 | cut -c1-400 |
              while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK" || { echo "::error::未找到构建产物 $APK"; exit 1; }
          cp "$APK" "$RUNNER_TEMP/xplay-v$VERSION.apk"
          SHA=$(sha256sum "$RUNNER_TEMP/xplay-v$VERSION.apk" | cut -d' ' -f1)
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK 大小：$(du -h "$RUNNER_TEMP/xplay-v$VERSION.apk" | cut -f1)  SHA256=$SHA"

      - name: Verify signature
        run: |
          keytool -printcert -jarfile "$RUNNER_TEMP/xplay-v$VERSION.apk" | grep -Ei "owner|sha1|sha-1|valid"

      - name: Compose release body
        run: |
          python3 - <<'PY'
          import os
          notes = open(os.environ["NOTES_FILE"], encoding="utf-8").read().strip()
          body = (
              "%s\n\n---\n\n"
              "- 版本：v%s（versionCode %s）\n"
              "- 架构：Android arm64-v8a\n"
              "- SHA-256：`%s`\n"
              "- 构建：GitHub Actions #%s\n"
          ) % (
              notes,
              os.environ["VERSION"],
              os.environ["BUILD"],
              os.environ.get("APK_SHA256", ""),
              os.environ.get("GITHUB_RUN_NUMBER", ""),
          )
          path = os.path.join(os.environ["RUNNER_TEMP"], "body.md")
          open(path, "w", encoding="utf-8").write(body)
          print(body)
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: main
          name: XPlay v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/body.md
          files: ${{ runner.temp }}/xplay-v${{ env.VERSION }}.apk
          prerelease: ${{ env.PRERELEASE }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}

      - name: Update update.json on main
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "预发布版本：跳过 update.json 更新"
            exit 0
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/xplay-v$VERSION.apk"
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -fsSIL -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "第 $i 次校验发布资产未就绪（HTTP $code），3 秒后重试"
            sleep 3
          done
          if [ "$code" != "200" ]; then
            echo "::error::发布资产不可访问：$URL（HTTP $code），已中止 update.json 更新"
            exit 1
          fi
          echo "发布资产可访问：$URL"
          export APK_URL="$URL"

          git fetch origin main
          git checkout -f -B main origin/main
          git pull --ff-only origin main
          python3 - <<'PY'
          import datetime, json, os
          version = os.environ["VERSION"]
          notes = open(os.environ["NOTES_FILE"], encoding="utf-8").read().strip()
          url = os.environ["APK_URL"]
          data = {
              "version": version,
              "build": int(os.environ["BUILD"]),
              "apkUrl": url,
              "apkUrls": [url],
              "notes": notes,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(url)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- update.json; then
            echo "update.json 无变化，跳过提交"
            exit 0
          fi
          git add update.json
          git commit -m "chore(release): update.json -> v$VERSION [skip ci]"
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "## XPlay v$VERSION"
            echo ""
            echo "- versionCode: $BUILD"
            echo "- 预发布: $PRERELEASE"
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo ""
            echo "### 更新说明"
            echo ""
            cat "$NOTES_FILE" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
